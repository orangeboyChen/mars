apply plugin: 'com.android.library'

apply from: rootProject.file('gradle/WeChatPublish.gradle')

group PROJ_GROUP
version PROJ_VERSION
artifactId = PROJ_ARTIFACTID

android {
    namespace "com.tencent.mars.xlog"
    compileSdkVersion 34
    defaultConfig {
        minSdkVersion 19
        targetSdkVersion 29
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }
    sourceSets {
        main {
            java {
                srcDir "src/main/java"
            }
            jni {
                srcDir "src/main/jni"
            }
            jniLibs {
                srcDir "libs"
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release {
            proguardFile 'proguard-rules.pro'
        }
    }
}

// JitPack builds the AAR from source and has no NDK, so the prebuilt native
// libraries published with the release must already be in `libs/<abi>/`
// (see ../../jitpack.yml). Fail loudly instead of shipping an AAR without .so.
afterEvaluate {
    if (System.getenv('JITPACK') == 'true') {
        def abis = file('libs').listFiles()?.findAll { it.directory } ?: []
        if (abis.isEmpty()) {
            throw new GradleException(
                    "No prebuilt native libraries found in ${file('libs')}. " +
                    "jitpack.yml downloads them from the GitHub release, check its 'before_install' step.")
        }
    }
}
