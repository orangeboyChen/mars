name: Release Mars Android AARs

# Builds libmarsxlog.so / libmarsstn.so for every Android ABI with the NDK,
# packages them into mars_xlog_sdk / mars_android_sdk AARs and publishes the
# AARs (plus a zip of the native libraries) to a GitHub release.
#
# The same release assets are what jitpack.yml consumes: JitPack has an Android
# SDK but no NDK, so the native libraries are downloaded from the release
# instead of being compiled again.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, e.g. v0.1.0'
        required: true
        default: 'v0.1.0'
  push:
    tags:
      - 'v*'

env:
  ABIS: armeabi-v7a arm64-v8a x86_64

jobs:
  aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if this tag was already published
        id: published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1 &&
             gh release view "$TAG" --json assets -q '.assets[].name' | grep -qx 'mars-android-native.zip'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "mars-android-native.zip is already published for $TAG, nothing to do."
          fi

      - uses: actions/setup-java@v4
        if: steps.published.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        if: steps.published.outputs.skip != 'true'

      - name: Install Android SDK components
        if: steps.published.outputs.skip != 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;27.1.12297006"

      - name: Build native libraries
        if: steps.published.outputs.skip != 'true'
        run: |
          export NDK_ROOT=$ANDROID_HOME/ndk/27.1.12297006
          cd mars
          python3 build_android.py "$VERSION" $ABIS
          python3 build_android.py "$VERSION" --xlog-only $ABIS
        env:
          VERSION: ${{ github.ref_name }}

      - name: Build AARs
        if: steps.published.outputs.skip != 'true'
        run: |
          cd mars
          ./gradlew -Prelease --no-daemon \
            :libraries:mars_xlog_sdk:assembleRelease \
            :libraries:mars_android_sdk:assembleRelease

      - name: Collect artifacts
        if: steps.published.outputs.skip != 'true'
        run: |
          mkdir -p dist
          cp mars/libraries/mars_xlog_sdk/build/outputs/aar/mars_xlog_sdk-release.aar dist/mars-xlog.aar
          cp mars/libraries/mars_android_sdk/build/outputs/aar/mars_android_sdk-release.aar dist/mars-core.aar
          cd mars/libraries && zip -q -r "$GITHUB_WORKSPACE/dist/mars-android-native.zip" \
            mars_xlog_sdk/libs mars_android_sdk/libs

      - uses: actions/upload-artifact@v4
        if: steps.published.outputs.skip != 'true'
        with:
          name: mars-android
          path: dist/

      - name: Publish release
        if: steps.published.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.published.outputs.tag }}" \
            --title "${{ steps.published.outputs.tag }}" --generate-notes \
            dist/mars-xlog.aar dist/mars-core.aar dist/mars-android-native.zip || \
          gh release upload "${{ steps.published.outputs.tag }}" \
            dist/mars-xlog.aar dist/mars-core.aar dist/mars-android-native.zip --clobber
