name: Rust

# Build / lint / test gate for the Rust port of the xlog pipeline that lives in
# ./rust. It is deliberately independent from the C++/CMake release workflows:
# the Rust workspace must stay green on every push and PR that touches it.

on:
  push:
    branches:
      - master
    # mars/xlog, mars/comm and mars/zstd are compiled by compat/cpp/build.sh:
    # a change to the C++ that the port has to match must run the diff too.
    paths:
      - 'rust/**'
      - 'compat/**'
      - 'mars/xlog/**'
      - 'mars/comm/**'
      - 'mars/zstd/**'
      - 'mars/libraries/**'
      - 'mars/gradle/**'
      - 'mars/build.gradle.kts'
      - 'mars/settings.gradle.kts'
      - 'samples/android/**'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'compat/**'
      - 'mars/xlog/**'
      - 'mars/comm/**'
      - 'mars/zstd/**'
      - 'mars/libraries/**'
      - 'mars/gradle/**'
      - 'mars/build.gradle.kts'
      - 'mars/settings.gradle.kts'
      - 'samples/android/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: '-D warnings'

defaults:
  run:
    working-directory: rust

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: cargo test
        run: cargo test --workspace --all-targets
      - name: cargo test (release)
        run: cargo test --workspace --release

  build:
    name: build (release)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build --workspace --release --all-targets

  xcframework:
    name: xcframework (cargo)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # The Apple distribution is the Rust static library too: no CMake, no C++.
      - name: Build MarsXlog.xcframework
        run: cd mars && python3 build_xcframework.py --zip
      - name: Check the slices
        run: |
          set -euo pipefail
          cd mars/cmake_build/XCFramework/MarsXlog.xcframework
          for slice in ios-arm64 ios-arm64_x86_64-simulator; do
            test -f "$slice/Headers/mars_xlog.h" || {
              echo "::error::$slice ships no mars_xlog.h"
              exit 1
            }
            lib=$(ls "$slice"/*.a)
            nm -gU "$lib" | grep -q '_mars_xlog_open' || {
              echo "::error::$slice/$lib exports no mars_xlog_open"
              exit 1
            }
            echo "$slice: $(basename "$lib") exports mars_xlog_open"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: MarsXlog.xcframework
          path: mars/cmake_build/XCFramework/MarsXlog.xcframework.zip

  android:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.1.12297006
      # The runner image already ships the Android SDK; it is pinned here
      # because the `cargo build` step derives the NDK path from it.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            clang: aarch64-linux-android24-clang
          - target: armv7-linux-androideabi
            clang: armv7a-linux-androideabi24-clang
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # `android-actions/setup-android` is intentionally not used: it installs
      # the long-removed `tools` SDK package, so its `sdkmanager` call exits
      # non-zero and the job fails before any Rust code is compiled. The SDK
      # (and its `sdkmanager`) that the runner image already provides is
      # enough to install the NDK.
      - name: Install the Android NDK
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # `yes` is killed by SIGPIPE as soon as sdkmanager stops reading, and
          # under `pipefail` that 141 would fail the job even though sdkmanager
          # itself succeeded. Grouping it keeps the pipeline status to
          # sdkmanager's own exit code.
          { yes || true; } | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "ndk;${NDK_VERSION}"
          test -d "$ANDROID_HOME/ndk/${NDK_VERSION}"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # `zstd-sys` compiles C, so both cc-rs and rustc need the NDK clang. The
      # two of them spell the env var prefixes differently, so the names are
      # built in the shell rather than from `env:`; see the comment below.
      # Only the FFI crate is built: it is what the Android glue links against
      # and it pulls the rest of the workspace in through path deps.
      - name: cargo build
        working-directory: rust
        run: |
          set -euo pipefail
          target="${{ matrix.target }}"
          # `aarch64-linux-android` -> `aarch64_linux_android`
          flat="$(printf '%s' "$target" | tr '-' '_')"
          upper="$(printf '%s' "$flat" | tr '[:lower:]' '[:upper:]')"
          ndk_bin="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          clang="$ndk_bin/${{ matrix.clang }}"
          test -x "$clang"
          # Casing matters here and the two prefixes are spelled differently:
          # cargo reads the upper-cased `CARGO_TARGET_<TRIPLE>_LINKER`, while
          # cc-rs reads `CC_<triple>` verbatim, i.e. dashes kept and no
          # upper-casing (it also tries the underscore form, then `TARGET_CC`,
          # then `CC`). The upper-cased `CC_<TRIPLE>` is silently ignored on
          # Linux, which makes cc-rs fall back to a bare
          # `<triple>-clang` on `$PATH` and fail.
          # Note: `CC_<triple>` with the dashes is what cc-rs checks first, but
          # neither bash nor zsh accepts a hyphen in `export NAME=...`, so the
          # underscore spelling (cc-rs' second candidate) is used instead.
          export "CC_${flat}=$clang"
          export "AR_${flat}=$ndk_bin/llvm-ar"
          export "CARGO_TARGET_${upper}_LINKER=$clang"
          # So that plain `llvm-ar` and friends are reachable too.
          export PATH="$ndk_bin:$PATH"
          cargo build --release -p mars-xlog-ffi --target "$target"
          # The JNI crate is what the Android glue will link against; keep it
          # buildable for every ABI even before gradle switches over.
          cargo build --release -p mars-xlog-jni --target "$target"
          ls -l "target/$target/release/libmarsxlog.so"

  android-aar:
    name: aar (gradle + cargo)
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.1.12297006
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          { yes || true; } | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          test -d "$ANDROID_HOME/ndk/${NDK_VERSION}"
      # Proves the whole path: the Kotlin DSL build cross-compiles the Rust JNI
      # crate per ABI and packages every `libmarsxlog.so` into the AAR.
      - name: Build the xlog AAR
        working-directory: mars
        run: ./gradlew --no-daemon :libraries:mars_xlog_sdk:assembleRelease
      - name: Check the packaged libraries
        working-directory: mars
        run: |
          set -euo pipefail
          aar=libraries/mars_xlog_sdk/build/outputs/aar/mars_xlog_sdk-release.aar
          nm="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          readelf="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$aar" | grep -q "jni/$abi/libmarsxlog.so" || {
              echo "::error::$aar is missing jni/$abi/libmarsxlog.so"
              exit 1
            }
            exports=$("$nm" -D --defined-only "libraries/mars_xlog_sdk/build/generated/jniLibs/$abi/libmarsxlog.so" \
              | grep -c 'Java_com_tencent_mars_xlog_Xlog_' || true)
            if [ "$exports" -lt 12 ]; then
              echo "::error::$abi library exports $exports JNI methods, expected 12"
              exit 1
            fi
            echo "$abi: $exports JNI exports"
            # Android 15 devices use 16 KiB pages and refuse to load a 4 KiB
            # ELF; lld only defaults to 16 KiB on newer NDKs, so assert it.
            align=$("$readelf" -l "libraries/mars_xlog_sdk/build/generated/jniLibs/$abi/libmarsxlog.so" \
              | awk '$1 == "LOAD" { print $NF; exit }')
            if [ "$align" != "0x4000" ]; then
              echo "::error::$abi libmarsxlog.so is $align aligned, expected 0x4000"
              exit 1
            fi
            echo "$abi: 16 KiB aligned"
          done

      # End-to-end check: the sample consumes the AAR straight from
      # mavenLocal and must build without an NDK.
      - name: Publish the AAR locally
        working-directory: mars
        run: ./gradlew --no-daemon -Prelease :libraries:mars_xlog_sdk:publishToMavenLocal

      - name: Build the sample app
        working-directory: samples/android/xlogSample
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Check the sample APK
        working-directory: samples/android/xlogSample
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            unzip -l "$apk" | grep -q "lib/$abi/libmarsxlog.so" || {
              echo "::error::$apk is missing lib/$abi/libmarsxlog.so"
              exit 1
            }
          done
          if unzip -l "$apk" | grep -q 'libc++_shared'; then
            echo "::error::$apk still ships the C++ runtime"
            exit 1
          fi
          echo "sample APK carries only the Rust libmarsxlog.so"

  apple:
    name: build (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo build --release -p mars-xlog-ffi --target ${{ matrix.target }}

  compat:
    name: compat (c++ <-> rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # Both halves of the differential test are built explicitly so a build
      # failure is attributed to the right side. `defaults.run` puts every step
      # in ./rust, so the repo-root steps need the workspace path.
      - name: Build the C++ compat tool
        working-directory: ${{ github.workspace }}
        run: ./compat/cpp/build.sh
      - name: Build the Rust compat tool
        working-directory: rust
        run: cargo build -p mars-xlog-compat
      - name: Diff the two implementations
        working-directory: ${{ github.workspace }}
        run: python3 compat/run.py
      # The repo vendors zstd 1.4.4 while the Rust side builds 1.5.7, and
      # different zstd versions do not emit identical bytes. When the runner's
      # libzstd happens to be the same version as the Rust one, run the matrix
      # again against it and require byte-identical output everywhere.
      - name: Diff against the system zstd (byte exact)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rust_zstd="$(sed -n 's/^version = ".*+zstd\.\(.*\)".*/\1/p'             <(grep -A1 'name = "zstd-sys"' rust/Cargo.lock))"
          sys_zstd="$(pkg-config --modversion libzstd)"
          echo "zstd: rust ${rust_zstd:-?} vs system ${sys_zstd}"
          if [ "${rust_zstd}" != "${sys_zstd}" ]; then
            echo "versions differ, skipping the byte-exact pass"
            exit 0
          fi
          SYSTEM_ZSTD=1 ./compat/cpp/build.sh compat/cpp/compat_tool_system
          python3 compat/run.py --strict-bytes --cpp-bin compat/cpp/compat_tool_system

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --workspace --no-deps
